<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NLP Coach Oefenapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: één smalle kolom zoals een oefenboekje; onderin een vaste tabbalk; de oefenkaart neemt het scherm over. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#18211E; --muted:#56635E; --line:#D3DCD7;
  --accent:#1D6A5A; --accent-ink:#FFFFFF; --accent-soft:#D6EBE4; --kite:#C9742A; --kite-soft:#F6E6D6;
  --good:#2C7A4B; --good-soft:#DDF0E3; --bad:#A8443A; --bad-soft:#F6E1DE;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E5ECE8; --muted:#9BA9A3; --line:#2D3935;
  --accent:#5DC0A6; --accent-ink:#0E1A16; --accent-soft:#1E3A33; --kite:#E39A55; --kite-soft:#3A2A1C;
  --good:#6CCB8F; --good-soft:#1C3527; --bad:#EE8B80; --bad-soft:#3D2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E5ECE8; --muted:#9BA9A3; --line:#2D3935;
  --accent:#5DC0A6; --accent-ink:#0E1A16; --accent-soft:#1E3A33; --kite:#E39A55; --kite-soft:#3A2A1C;
  --good:#6CCB8F; --good-soft:#1C3527; --bad:#EE8B80; --bad-soft:#3D2220; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
.wrap{max-width:600px; margin:0 auto; padding-block:20px 110px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15}
h1{font-size:1.75rem; font-weight:700; letter-spacing:-.01em}
h2{font-size:1.25rem; font-weight:700}
h3{font-size:1.05rem; font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex; flex-direction:column; gap:16px}
.stack-s{display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--kite); outline-offset:2px}

/* Header */
.top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
.streak{font-family:var(--mono); font-size:.8rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.streak b{display:block; font-family:var(--display); font-size:1.5rem; color:var(--ink)}

/* Today card */
.today{background:var(--accent); color:var(--accent-ink); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:14px}
.today h2{font-size:1.5rem}
.today .sub{opacity:.85}
.seg{display:flex; background:rgba(0,0,0,.14); border-radius:999px; padding:4px; gap:4px; width:max-content; max-width:100%}
.seg button{border:0; background:transparent; color:inherit; padding:6px 14px; border-radius:999px; font-family:var(--mono); font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent-ink); color:var(--accent)}
.go{border:0; background:var(--accent-ink); color:var(--accent); font-family:var(--display); font-weight:700; font-size:1.1rem; padding:14px 18px; border-radius:12px; text-align:left; display:flex; justify-content:space-between; align-items:center}

/* Kompas strip */
.kompas{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.kompas div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:.78rem; line-height:1.25; text-align:center; color:var(--muted)}
.kompas b{display:block; color:var(--ink); font-size:.82rem}

/* Module + deck list */
.module{display:flex; flex-direction:column; gap:8px}
.module-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.deck{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.deck:hover{border-color:var(--accent)}
.deck .t{font-weight:700; min-width:0}
.deck .d{grid-column:1; font-size:.85rem; color:var(--muted); min-width:0}
.deck .n{grid-row:1 / span 2; grid-column:2; font-family:var(--mono); font-size:.8rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.bar{height:6px; background:var(--sunk); border-radius:99px; overflow:hidden; grid-column:1 / -1}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.chip{display:inline-block; font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:99px; background:var(--kite-soft); color:var(--kite); vertical-align:middle}

/* Bottom nav */
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index:5}
nav.tabs .in{max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
nav.tabs button{border:0; background:transparent; padding:8px 4px; border-radius:10px; font-size:.85rem; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px}
nav.tabs button svg{width:22px; height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent); background:var(--accent-soft); font-weight:700}

/* Session */
.session{position:fixed; inset:0; background:var(--bg); z-index:10; overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.session .in{max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:16px; min-height:100%}
.s-head{display:flex; align-items:center; gap:12px}
.close{border:1px solid var(--line); background:var(--surface); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none}
.progress{flex:1; height:8px; background:var(--sunk); border-radius:99px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--kite); transition:width .3s}
.count{font-family:var(--mono); font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:12px}
.quote{font-family:var(--display); font-weight:500; font-size:1.35rem; line-height:1.3; text-wrap:balance}
.quote::before{content:"“"} .quote::after{content:"”"}
.quote.plain::before,.quote.plain::after{content:none}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:12px; text-align:left; min-height:52px; line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb .v{font-family:var(--display); font-weight:700; font-size:1.1rem}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb .tip{border-top:1px solid color-mix(in srgb, var(--ink) 15%, transparent); padding-top:8px}
.ph{display:inline-block; font-family:var(--mono); font-size:.7rem; padding:3px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.ph.nlc{background:var(--sunk); color:var(--ink)}
.ph.cmc{background:var(--kite-soft); color:var(--kite)}
.legend{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:.8rem; color:var(--muted)}
.fb .tip b{font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase}
.primary{border:0; background:var(--accent); color:var(--accent-ink); font-weight:700; padding:14px; border-radius:12px; font-size:1rem; width:100%}
.ghost{border:1px solid var(--line); background:var(--surface); padding:10px 14px; border-radius:10px}
.spacer{flex:1}

/* Order exercise */
.seq{display:flex; flex-direction:column; gap:6px; min-height:60px; padding:8px; border:1.5px dashed var(--line); border-radius:12px}
.seq .empty{color:var(--muted); font-size:.9rem; padding:8px}
.step{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; text-align:left; width:100%; line-height:1.3}
.step .no{font-family:var(--mono); font-size:.8rem; color:var(--accent); min-width:1.4em; padding-top:2px}
.step.right{border-color:var(--good); background:var(--good-soft)}
.step.wrong{border-color:var(--bad); background:var(--bad-soft)}
.pool{display:flex; flex-direction:column; gap:6px}

/* Naslag */
details.ref{background:var(--surface); border:1px solid var(--line); border-radius:12px}
details.ref summary{padding:14px 16px; cursor:pointer; font-family:var(--display); font-weight:700; font-size:1.05rem; list-style:none; display:flex; justify-content:space-between; gap:8px}
details.ref summary::after{content:"+"; font-family:var(--mono); color:var(--muted)}
details.ref[open] summary::after{content:"–"}
details.ref .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.88rem}
th,td{text-align:left; vertical-align:top; padding:8px 6px; border-top:1px solid var(--line)}
th{font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500; border-top:0}
ol.plain,ul.plain{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:4px}

/* Progress view */
.stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat div{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px}
.stat b{display:block; font-family:var(--display); font-size:1.6rem; font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem; color:var(--muted)}
.boxes{display:flex; gap:3px; grid-column:1 / -1}
.boxes i{flex:1; height:6px; border-radius:2px; background:var(--sunk)}
.done{text-align:center; align-items:center; padding-top:40px}
.done .big{font-family:var(--display); font-size:3rem; font-weight:700; font-variant-numeric:tabular-nums}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Hoofdmenu"><div class="in" id="tabs"></div></nav>
<div class="session" id="session" hidden></div>

<script>
/* ============ INHOUD (uit coach-reader en Master-reader; “aanvulling” = online bron) ============ */
const MM = {
  gl:{n:'Gedachtelezen', g:'Vervorming', d:'Weten hoe iemand over iets denkt, zonder het proces aan te geven.', q:'“Hoe weet je dat? Waar baseer je dat op?”', e:'Achterhaal de bron van informatie.'},
  vp:{n:'Verloren performatief', g:'Vervorming', d:'Waardeoordeel waarbij degene die oordeelt is weggelaten.', q:'“Volgens wie…?”', e:'Verzamel bewijs: achterhaal bron, performatief en overtuigingsstrategie.'},
  og:{n:'Oorzaak – gevolg', g:'Vervorming', d:'De oorzaak wordt ten onrechte buiten de spreker geplaatst (A > B).', q:'“Hoe komt het dat…?” / “Heb je ooit meegemaakt dat…?”', e:'Achterhaal de keuze, vraag een tegenvoorbeeld.'},
  ce:{n:'Complexe equivalentie', g:'Vervorming', d:'Twee ervaringen worden uitgelegd als synoniem (A = B).', q:'“Hoe betekent het feit dat X, dat Y?” / “Ken je iemand die…?”', e:'Achterhaal de equivalentie, vraag een tegenvoorbeeld.'},
  vo:{n:'Vooronderstelling', g:'Vervorming', d:'Wat waar moet zijn om de zin te laten kloppen.', q:'“Hoe weet je dat…?” / vraag naar de vooronderstelling', e:'Omschrijf werkwoorden en keuzes; achterhaal interne representaties.'},
  uw:{n:'Universele waarheid', g:'Generalisatie', d:'Alle, iedere, nooit, iedereen, niemand…', q:'“Nooit?” / “Wat zou er gebeuren als…?”', e:'Achterhaal een tegenvoorbeeld, effecten en resultaat.'},
  mn:{n:'Modal operator van noodzaak', g:'Generalisatie', d:'Moet, behoort, het is nodig, mag niet…', q:'“Wat zou er gebeuren als je dat niet doet?” / “Want?”', e:'Achterhaal effecten en uitkomst.'},
  mm:{n:'Modal operator van (on)mogelijkheid', g:'Generalisatie', d:'Kan, kan niet, zal niet, misschien…', q:'“Wat houdt je tegen?” / “Wat zou er gebeuren als je dat wel deed?”', e:'Achterhaal oorzaken.'},
  no:{n:'Nominalisatie', g:'Weglating', d:'Proceswoord dat een zelfstandig naamwoord is geworden; past niet in een kruiwagen.', q:'“Hoe zou je … willen [werkwoord]?”', e:'Keer om naar een proces; specificeer het werkwoord.'},
  ow:{n:'Ongespecificeerd werkwoord', g:'Weglating', d:'Het werkwoord zegt niet hoe het precies ging.', q:'“Hoe precies…?”', e:'Specificeer het werkwoord.'},
  sw:{n:'Simpele weglating', g:'Weglating', d:'Er ontbreekt waarover of over wie het gaat.', q:'“Waarover? Over wie?”', e:'Achterhaal de weglating.'},
  ri:{n:'Weglaten referentie-index', g:'Weglating', d:'Geen specifiek persoon of ding aangegeven.', q:'“Wie precies…?”', e:'Achterhaal de referentie-index.'},
  vw:{n:'Vergelijkende weglating', g:'Weglating', d:'Beter, erger, meest… zonder waarmee vergeleken wordt.', q:'“Erger dan wie/wat? Vergeleken met wie?”', e:'Achterhaal de vergelijkende weglating.'}
};

/* Wat doe je ermee in je coaching (per patroon) */
const MMC={
  gl:'De cliënt merkt vaak dat het een interpretatie is, geen feit. Vraag door: “Wat zou het nog meer kunnen betekenen?” Zo ontstaan andere betekenissen en kan de relatie tot die persoon veranderen (kompas: relatie veranderen).',
  vp:'Komt de bron boven (“dat zei mijn vader altijd”), dan wordt een vanzelfsprekende waarheid de regel van iemand anders. Vraag: “Is dat nu nog jouw eigen regel? Wat vind jij zelf?” Vaak is het een Ouder-boodschap (TA); vanuit de Volwassene kiest de cliënt wat hij houdt. Ook een mooie ingang voor Byron Katie: “Is het waar?”',
  og:'Zodra de koppeling zichtbaar is, ontstaat keuze: de cliënt is niet langer alleen het gevolg. Vraag naar een tegenvoorbeeld en dan: “Wat deed je toen anders?” Dat is een uitzondering en een hulpbron voor de hulpbronstaat (fase 4).',
  ce:'Een tegenvoorbeeld maakt het gelijkteken los. Raakt het identiteit (“dan ben ik een mislukking”), dan is dit je ingang om identiteit te verruimen: “Wie ben je nog meer dan iemand zonder werk?”',
  vo:'De verborgen aanname wordt bespreekbaar. Daar zit vaak de eigenlijke vraag: check of het contract nog klopt en of je met het goede onderwerp werkt.',
  uw:'Eén uitzondering breekt de generalisatie. Ga de uitzondering in: wanneer was het, wat deed je, wie was je toen? Dat levert hulpbronnen op.',
  mn:'Je hoort de regel en wat de cliënt vreest als hij die loslaat. Vaak zit er een driver achter (Wees perfect, Doe je best). Onderzoek wat de regel oplevert en kost, zodat “moeten” “kiezen” kan worden.',
  mm:'De belemmering wordt concreet, en wat concreet is kun je aanpakken. Vervolgvraag: “Wat heb je nodig om dat wel te kunnen?” Zo kom je bij middelen (sleutel 9) en hulpbronnen.',
  no:'Een ding ligt vast, een proces kun je beïnvloeden. Vraag wat de cliënt zelf anders zou willen doen in dat proces. Zo kom je bij de gewenste situatie.',
  ow:'De concrete handeling geeft een specifieke ervaring om mee te werken in de probleemstaat. Vaak blijkt die milder of anders dan het label deed vermoeden.',
  sw:'Je weet nu waar het eigenlijk over gaat, zodat je niet op het verkeerde onderwerp coacht. Een goed moment voor het contract: “Waar wil je vandaag mee werken?”',
  ri:'“Zij” wordt één persoon en één situatie. Het probleem krimpt tot iets werkbaars, en je weet met wie de relatie mag veranderen.',
  vw:'De maatstaf komt boven; vaak is die onhaalbaar of van iemand anders. Vraag: “Met wie of wat wil jij jezelf eigenlijk vergelijken?”'
};
for(const k in MMC) MM[k].c=MMC[k];
const mmItems = [
  {t:'Jij wordt ook gek van mij!', a:'gl', q:'Hoe weet je dat? Waar baseer je dat op?'},
  {t:'Mijn baas ziet me niet staan.', a:'gl', q:'Hoe weet je dat hij je niet ziet staan?'},
  {t:'Je weet toch dat ik het druk heb.', a:'gl', q:'Hoe weet je dat ik dat weet?'},
  {t:'Het is niet goed om te laat te komen.', a:'vp', q:'Volgens wie is het niet goed om te laat te komen?'},
  {t:'Mensen leren moeilijk.', a:'vp', q:'Volgens wie leren mensen moeilijk?'},
  {t:'Als ik geen lijstjes maak, dan wordt het een chaos.', a:'og', q:'Heb je ooit meegemaakt dat het goed ging terwijl je geen lijstje had gemaakt?'},
  {t:'Mijn man raakt er ook gestrest van.', a:'og', q:'Hoe komt het dat hij daar gestrest van raakt?'},
  {t:'Ik heb geen werk, dus ik ben een mislukking.', a:'ce', q:'Hoe betekent het feit dat je geen werk hebt, dat je een mislukking bent?'},
  {t:'Als hij niet naar me kijkt, houdt hij niet van me.', a:'ce', q:'Ken je iemand die van je houdt en soms niet naar je kijkt?'},
  {t:'Als mijn baas wist hoe hard ik werk, zou hij dit niet doen.', a:'vo', q:'Hoe weet je dat je baas dat niet weet?'},
  {t:'Ik doe nooit iets goed.', a:'uw', q:'Nooit? Wat zou er gebeuren als je wel iets goed zou doen?'},
  {t:'Niemand neemt hier een beslissing.', a:'uw', q:'Niemand? Is er ooit iemand geweest die wel een beslissing nam?'},
  {t:'Ik moet met lijstjes gaan werken en rust nemen.', a:'mn', q:'Wat zou er gebeuren als je dat niet doet?'},
  {t:'Ik mag je niet vertellen waar het op staat.', a:'mn', q:'Wat zou er gebeuren als je het wel vertelt?'},
  {t:'Ik kan niet zomaar bewegen wanneer ik dat wil.', a:'mm', q:'Wat houdt je tegen?'},
  {t:'Ik zal me nooit kunnen ontwikkelen.', a:'mm', q:'Wat zou er gebeuren als je dat wel kon?'},
  {t:'De communicatie met mijn ouders loopt niet.', a:'no', q:'Hoe zou je met je ouders willen communiceren?'},
  {t:'Er is een probleem met de samenwerking.', a:'no', q:'Hoe zou je met elkaar willen samenwerken?'},
  {t:'Zij heeft mij afgewezen.', a:'ow', q:'Hoe heeft ze je precies afgewezen?'},
  {t:'Ik voel mij niet op mijn gemak.', a:'sw', q:'Waarover? Bij wie?'},
  {t:'Zij luisteren niet naar mij.', a:'ri', q:'Wie luisteren er niet naar jou?'},
  {t:'Hij is nog erger.', a:'vw', q:'Erger dan wie? Vergeleken met wie?'}
];
const PRESUP = {
  be:{n:'Bestaan', d:'Zelfstandige naamwoorden en persoonlijke voornaamwoorden: waarover we praten, bestaat.'},
  mo:{n:'Mogelijkheid / noodzakelijkheid', d:'Woorden als moet, wil, kan.'},
  og:{n:'Oorzaak / gevolg', d:'Koppelwoorden waarbij het ene deel het gevolg is van het andere (A → B).'},
  ce:{n:'Complexe equivalentie', d:'Zinsdelen gelijkgesteld als gelijkwaardig (A = B), vaak met “is/bent”.'},
  bw:{n:'Bewustzijn', d:'Woorden voor waarnemen: zien, horen, voelen, denken, realiseren, bewust zijn van.'},
  ti:{n:'Tijd', d:'Tijdskader in werkwoorden: verleden, heden, toekomst.'},
  bv:{n:'Bijwoord / bijvoeglijk naamwoord', d:'Zegt iets over een werkwoord of zelfstandig naamwoord.'},
  of:{n:'Of', d:'Een keuze, waarbij het onderliggende al vaststaat.'},
  or:{n:'Ordinaal', d:'Een rangorde: eerste, tweede, negende.'}
};
const presupItems = [
  {t:'Als we praten over de oplossing, dan bestaat die ook.', a:'be'},
  {t:'Moet je veranderen of wil je veranderen?', a:'mo'},

/* ============ OPSLAG (alleen in deze browser) ============ */
const KEY='nlpcoach.v1';
const today=()=>{const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const INTERVAL=[0,1,3,7,14,30];
let S={items:{}, days:[], min:10};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S, JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}};
const rec=(k)=>S.items[k]||{box:0,last:null,seen:0,ok:0};
const due=(k)=>{const r=S.items[k]; if(!r) return true; return today()-r.last >= INTERVAL[r.box]};
function mark(k, ok){
  const r=rec(k); r.seen++; if(ok){r.ok++; r.box=Math.min(r.box+1,5)} else r.box=Math.max(r.box-2,0);
  r.last=today(); S.items[k]=r; if(!S.days.includes(today())) S.days.push(today()); save();
}
const keysOf=(d)=>d.items.map((_,i)=>d.id+':'+i);
function mastery(d){const ks=keysOf(d); return ks.reduce((s,k)=>s+Math.min(rec(k).box,3)/3,0)/ks.length}
function streak(){const set=new Set(S.days); let n=0, t=today(); if(!set.has(t)) t--; while(set.has(t)){n++; t--} return n}

let Q=[], qi=0, score=0;
function startToday(){
  const n={5:8,10:15,20:30}[S.min]||15;
  const pool=DECKS.flatMap(d=>d.items.map((_,i)=>({d:d.id,i,k:d.id+':'+i})));
  const dueL=shuffle(pool.filter(p=>due(p.k))).sort((a,b)=>rec(a.k).box-rec(b.k).box);
  let list=dueL.slice(0,n); if(list.length<n) list=list.concat(shuffle(pool.filter(p=>!list.includes(p))).slice(0,n-list.length));
  openSession(shuffle(list), 'Oefenset van vandaag');
}
function startDeck(id){
  const d=deckById(id); openSession(shuffle(d.items.map((_,i)=>({d:id,i,k:id+':'+i}))), d.title);
}
let title='';
function openSession(list,t){Q=list; qi=0; score=0; title=t; $('#session').hidden=false; document.body.style.overflow='hidden'; show()}
function closeSession(){$('#session').hidden=true; document.body.style.overflow=''; render()}
function head(){
  return `<div class="s-head"><button type="button" class="close" id="x" aria-label="Stoppen">✕</button><div class="progress" aria-hidden="true"><i style="width:${qi/Q.length*100}%"></i></div><span class="count">${Math.min(qi+1,Q.length)}/${Q.length}</span></div>`;
}
function show(){
  const el=$('#session');
  if(qi>=Q.length){
    el.innerHTML=`<div class="in"><div class="stack done"><span class="eyebrow">${esc(title)}</span><div class="big">${score}/${Q.length}</div><h2>${score===Q.length?'Alles raak.':score>=Q.length*.7?'Sterk geoefend.':'Goed bezig, dit komt terug.'}</h2><p class="muted">Wat nog niet zat, zie je de komende dagen vaker terug.</p></div><div class="spacer"></div><button type="button" class="primary" id="x">Klaar</button></div>`;
    $('#x').onclick=closeSession; $('#x').focus(); return;
  }
  const {d:id,i,k}=Q[qi], d=deckById(id), it=d.items[i];
  if(d.kind==='order') return showOrder(el,d,it,k);
  let opts, correct, ask=d.ask, text=it.t, one=d.one;
  if(d.kind==='mmq'){
    const others=shuffle(mmItems.filter(x=>x.a!==it.a)).slice(0,3).map(x=>x.q);
    opts=shuffle([it.q,...others]); correct=opts.indexOf(it.q); ask='Welke meta-vraag past hier het best?'; one=true;
  } else if(d.perItem){
    const order=shuffle(it.o.map((_,j)=>j)); opts=order.map(j=>it.o[j]); correct=order.indexOf(it.a); ask='';
  } else {
    const labels=d.optMap?Object.keys(d.optMap):d.options.map((_,j)=>j);
    const name=(x)=>d.optMap?d.optMap[x].n:d.options[x];
    let pickL=labels; if(labels.length>6 && d.id!=='fase') pickL=shuffle([it.a,...shuffle(labels.filter(x=>x!==it.a)).slice(0,5)]);
    else if(!d.one && d.id!=='fase') pickL=shuffle(labels);
    opts=pickL.map(name); correct=pickL.indexOf(it.a);
  }
  el.innerHTML=`<div class="in">${head()}
    <div class="card"><span class="eyebrow">${esc(d.title)} ${it.src?'<span class="chip">aanvulling</span>':''}</span>
      ${ask?`<p class="muted">${esc(ask)}</p>`:''}
      <p class="quote ${it.plain||d.perItem?'plain':''}">${esc(text)}</p></div>
    <div class="opts ${one?'one':''}" id="opts">${opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
  $('#x').onclick=closeSession;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j, correct, opts, d, it, k));
}
function answer(j, correct, opts, d, it, k){
  const ok=j===correct; mark(k,ok); if(ok) score++;
  document.querySelectorAll('#opts .opt').forEach((b,x)=>{b.disabled=true; if(x===correct) b.classList.add('right'); else if(x===j) b.classList.add('wrong')});
  const why=it.w || (d.why?d.why(it):'');
  const tip=d.tip?d.tip(it):''; const coach=d.coach?d.coach(it):''; const nlNote=(it.nl && d.id!=='nlniv')?`<p class="tip"><b>Neurologisch niveau</b><br><span class="ph nlc">${esc(NL[it.nl])}</span> De cliënt beschrijft het probleem op dit niveau. De oplossing ligt op een ander, meestal hoger niveau.</p>`:'';
  const verdict=ok?pick(GOOD):'Bijna.';
  const lead=ok?'':`Jij koos “${esc(opts[j])}”. Het is “${esc(opts[correct])}”.`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><span class="v">${verdict}</span>${lead?`<p>${lead}</p>`:''}${why?`<p>${esc(why)}</p>`:''}${tip?`<p class="tip"><b>Nog sterker</b><br>${esc(tip)}</p>`:''}${nlNote}${coachBlock(coach)}</div>
    <button type="button" class="primary" id="next" style="margin-top:12px">Volgende</button>`;
  $('#next').onclick=()=>{qi++; show(); $('#session').scrollTo(0,0)}; $('#next').focus();
}
function showOrder(el,d,it,k){
  let pool=shuffle(it.s.map((s,j)=>j)), seq=[];
  const draw=()=>{
    el.innerHTML=`<div class="in">${head()}
      <div class="card"><span class="eyebrow">${esc(d.title)}</span><p class="quote plain" style="font-size:1.15rem">${esc(it.t)}</p><p class="muted">Tik de stappen aan in de goede volgorde. Tik een gekozen stap om hem terug te zetten.</p></div>
      <div class="seq" id="seq">${seq.length?seq.map((j,n)=>`<button type="button" class="step" data-s="${n}"><span class="no">${n+1}</span><span>${esc(it.s[j])}</span></button>`).join(''):'<span class="empty">Jouw volgorde komt hier.</span>'}</div>
      <div class="pool">${pool.map(j=>`<button type="button" class="step" data-p="${j}"><span class="no">+</span><span>${esc(it.s[j])}</span></button>`).join('')}</div>
      <div id="fb">${pool.length===0?'<button type="button" class="primary" id="check">Controleer</button>':''}</div></div>`;
    $('#x').onclick=closeSession;
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const j=+b.dataset.p; pool=pool.filter(x=>x!==j); seq.push(j); draw()});
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const n=+b.dataset.s; pool.push(seq[n]); seq.splice(n,1); draw()});
    const c=$('#check'); if(c) c.onclick=check;
  };
  const check=()=>{
    const right=seq.filter((j,n)=>j===n).length, ok=right===seq.length; mark(k,ok); if(ok) score++;
    el.querySelectorAll('#seq .step').forEach((b,n)=>{b.disabled=true; b.classList.add(seq[n]===n?'right':'wrong')});
    el.querySelector('.pool').innerHTML='';
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><span class="v">${ok?pick(GOOD):right+' van '+seq.length+' op de goede plek.'}</span>
      ${ok?'':`<p><b>De volgorde:</b></p><ol class="plain">${it.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`}
      ${it.w?`<p class="tip"><b>Nog sterker</b><br>${esc(it.w)}</p>`:''}${coachBlock(ORDER_COACH[it.key])}</div>
      <button type="button" class="primary" id="next" style="margin-top:12px">Volgende</button>`;
    $('#next').onclick=()=>{qi++; show(); $('#session').scrollTo(0,0)}; $('#next').focus();
  };
  draw();
}
render();
</script>
